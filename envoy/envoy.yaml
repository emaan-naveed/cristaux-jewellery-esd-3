admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    # ----------------------------------------------------------------
    # HTTP listener — Active Health Checking
    # ----------------------------------------------------------------
    - name: http_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: http_ingress
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          "@timestamp": "%START_TIME%"
                          service: "envoy-http"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          response_code: "%RESPONSE_CODE%"
                          duration_ms: "%DURATION%"
                          upstream_host: "%UPSTREAM_HOST%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          x_request_id: "%REQ(X-REQUEST-ID)%"
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: app_healthcheck
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # ----------------------------------------------------------------
    # gRPC listener — Active Health Checking via HTTP/2
    # ----------------------------------------------------------------
    - name: grpc_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 50050
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpc_ingress
                codec_type: HTTP2
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          "@timestamp": "%START_TIME%"
                          service: "envoy-grpc"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          response_code: "%RESPONSE_CODE%"
                          duration_ms: "%DURATION%"
                          upstream_host: "%UPSTREAM_HOST%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          x_request_id: "%REQ(X-REQUEST-ID)%"
                          grpc_status: "%GRPC_STATUS%"
                route_config:
                  name: grpc_route
                  virtual_hosts:
                    - name: grpc_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: grpc_healthcheck
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # ----------------------------------------------------------------
    # HTTP cluster — Active Health Checks (interval: 2s, timeout: 1s, fail: 2, recover: 2)
    # ----------------------------------------------------------------
    - name: app_healthcheck
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 5s
      health_checks:
        - timeout: 1s
          interval: 2s
          unhealthy_threshold: 2
          healthy_threshold: 2
          http_health_check:
            path: "/metrics"
      load_assignment:
        cluster_name: app_healthcheck
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: app-a
                      port_value: 8000
              - endpoint:
                  address:
                    socket_address:
                      address: app-b
                      port_value: 8000
              - endpoint:
                  address:
                    socket_address:
                      address: app-c
                      port_value: 8000

    # ----------------------------------------------------------------
    # gRPC cluster — Active TCP Health Checks (interval: 2s, timeout: 1s, fail: 2, recover: 2)
    # ----------------------------------------------------------------
    - name: grpc_healthcheck
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 5s
      http2_protocol_options: {}
      health_checks:
        - timeout: 1s
          interval: 2s
          unhealthy_threshold: 2
          healthy_threshold: 2
          tcp_health_check: {}
      load_assignment:
        cluster_name: grpc_healthcheck
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: grpc-a
                      port_value: 50051
              - endpoint:
                  address:
                    socket_address:
                      address: grpc-b
                      port_value: 50051
              - endpoint:
                  address:
                    socket_address:
                      address: grpc-c
                      port_value: 50051
