filebeat.inputs:
  - type: container
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log
    stream: all

processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"

  - drop_event:
      when:
        not:
          regexp:
            container.name: "(app-[abc]|grpc-[abc]|envoy)"

  - drop_event:
      when:
        not:
          regexp:
            message: "^\\s*\\{"

  - decode_json_fields:
      fields: ["message"]
      target: "log_json"
      overwrite_keys: false
      add_error_key: true

  # gRPC logs put a status NAME (OK, NOT_FOUND) in status_code, but HTTP logs
  # put a NUMBER there. Move string values to their own field so the index
  # mapping (long) never sees a string.
  - script:
      lang: javascript
      id: split_grpc_status
      source: |
        function process(event) {
          var s = event.Get("log_json.status_code");
          if (typeof s === "string") {
            event.Put("log_json.grpc_status", s);
            event.Delete("log_json.status_code");
          }
        }

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "app-logs-%{+yyyy.MM.dd}"

setup.ilm.enabled: false
setup.template.name: "app-logs"
setup.template.pattern: "app-logs-*"

logging.level: info
logging.to_files: false